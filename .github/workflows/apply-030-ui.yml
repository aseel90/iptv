name: Apply Selyro 0.3 UI source

on:
  push:
    branches: [release/0.3.0-ui-refresh-final]
    paths: [tools/apply_ui030.py]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.0-ui-refresh-final
          fetch-depth: 0
      - name: Apply modern TV UI
        run: python3 tools/apply_ui030.py
      - name: Commit generated UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/selyro/tv/ui/SelyroApp.kt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(ui): modernize Selyro 0.3 TV surfaces'
          git push origin HEAD:release/0.3.0-ui-refresh-final
