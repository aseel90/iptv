name: Apply Selyro TV 0.3.6 Performance UX

on:
  push:
    branches: ['release/0.3.6-performance-ux']
    paths:
      - '.github/workflows/apply-036-performance-ux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.6-performance-ux
          fetch-depth: 0
      - name: Apply 0.3.6 source patch
        shell: bash
        env:
          PATCH_GZ_B64: 
        run: |
          set -euxo pipefail
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/036.patch
          git apply --check /tmp/036.patch
          git apply /tmp/036.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app docs/RELEASE-0.3.6.md
          git commit -m 'feat: Selyro TV 0.3.6 performance and UX upgrade'
          git push origin HEAD:release/0.3.6-performance-ux
