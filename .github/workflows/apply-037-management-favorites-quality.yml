name: Apply Selyro TV 0.3.7 management favorites quality

on:
  push:
    branches: ["release/0.3.7-management-favorites-quality"]
    paths: [".github/workflows/apply-037-management-favorites-quality.yml"]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.7-management-favorites-quality
          fetch-depth: 0
      - name: Apply 0.3.7 patch
        shell: bash
        run: |
          echo "" | base64 -d | gzip -d > /tmp/037.patch
          git apply /tmp/037.patch
      - name: Commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/apply-037-management-favorites-quality.yml docs/.placeholder-037
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: Selyro TV 0.3.7 management favorites quality"
          git push origin HEAD:release/0.3.7-management-favorites-quality
