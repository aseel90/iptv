name: Apply Selyro TV 0.3.7 management favorites quality

on:
  push:
    branches: ['release/0.3.7-management-favorites-quality']
    paths:
      - '.github/workflows/apply-037-management-favorites-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.7-management-favorites-quality
          fetch-depth: 0
      - name: Materialize 0.3.7 source files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/037/AccountStore.kt.gz.b64 | gzip -d > app/src/main/java/com/selyro/tv/data/AccountStore.kt
          base64 -d .ci/037/AppViewModel.kt.gz.b64 | gzip -d > app/src/main/java/com/selyro/tv/ui/AppViewModel.kt
          base64 -d .ci/037/SelyroApp.kt.gz.b64 | gzip -d > app/src/main/java/com/selyro/tv/ui/SelyroApp.kt
          base64 -d .ci/037/PlayerScreen.kt.gz.b64 | gzip -d > app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt
          base64 -d .ci/037/build.gradle.kts.gz.b64 | gzip -d > app/build.gradle.kts
          grep -q 'versionCode = 17' app/build.gradle.kts
          grep -q '0.3.7-management-favorites-quality' app/build.gradle.kts
          grep -q 'fun updateAccount' app/src/main/java/com/selyro/tv/ui/AppViewModel.kt
          grep -q 'ServerQualityBadge' app/src/main/java/com/selyro/tv/ui/SelyroApp.kt
          grep -q 'StreamQualityBadge' app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java/com/selyro/tv/data/AccountStore.kt app/src/main/java/com/selyro/tv/ui/AppViewModel.kt app/src/main/java/com/selyro/tv/ui/SelyroApp.kt app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt
          git rm -r .ci/037 docs/.placeholder-037 .github/workflows/apply-037-management-favorites-quality.yml
          git commit -m 'feat: Selyro TV 0.3.7 server favorites connection quality'
          git push origin HEAD:release/0.3.7-management-favorites-quality
