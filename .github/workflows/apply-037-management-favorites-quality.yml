name: Apply Selyro TV 0.3.7 management favorites quality

on:
  push:
    branches: ['release/0.3.7-management-favorites-quality']
    paths:
      - '.github/workflows/apply-037-management-favorites-quality.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.7-management-favorites-quality
          fetch-depth: 0
      - name: Apply 0.3.7 source update
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'versionCode = 17' app/build.gradle.kts; then
            echo '0.3.7 already applied'
            exit 0
          fi
          echo '' | base64 -d | gzip -d > /tmp/037.patch
          git apply --check /tmp/037.patch
          git apply /tmp/037.patch
          rm -f docs/.placeholder-037
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java/com/selyro/tv/data/AccountStore.kt app/src/main/java/com/selyro/tv/ui/AppViewModel.kt app/src/main/java/com/selyro/tv/ui/SelyroApp.kt app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt docs/.placeholder-037
          git commit -m 'feat: Selyro TV 0.3.7 server favorites connection quality'
          git push origin HEAD:release/0.3.7-management-favorites-quality
