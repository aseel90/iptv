name: Materialize Selyro TV 0.3.8 Navigation Source

on:
  push:
    branches: ['release/0.3.8-navigation-icons']
    paths:
      - '.github/workflows/apply-038-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.8-navigation-icons
          fetch-depth: 0
      - name: Apply source changes
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/selyro/tv/ui/SelyroApp.kt')
          s = p.read_text()
          if 'import androidx.compose.ui.graphics.ColorFilter' not in s:
              s = s.replace('import androidx.compose.ui.graphics.Color\n', 'import androidx.compose.ui.graphics.Color\nimport androidx.compose.ui.graphics.ColorFilter\n')
          label = '''@Composable
          private fun sectionLabel(section: Section): String = when (section) {
              Section.HOME -> tx("Home", "الرئيسية")
              Section.LIVE -> tx("Live TV", "القنوات")
              Section.MOVIES -> tx("Movies", "الأفلام")
              Section.SERIES -> tx("Series", "المسلسلات")
              Section.FAVORITES -> tx("Favorites", "المفضلة")
              Section.RECENT -> tx("Recent", "الأخيرة")
              Section.SETTINGS -> tx("Settings", "الإعدادات")
          }
          '''
          if 'private fun sectionIcon' not in s:
              assert label in s
              s = s.replace(label, label + '''
          private fun sectionIcon(section: Section): Int = when (section) {
              Section.HOME -> R.drawable.ic_nav_home
              Section.LIVE -> R.drawable.ic_nav_live
              Section.MOVIES -> R.drawable.ic_nav_movies
              Section.SERIES -> R.drawable.ic_nav_series
              Section.FAVORITES -> R.drawable.ic_nav_favorites
              Section.RECENT -> R.drawable.ic_nav_recent
              Section.SETTINGS -> R.drawable.ic_nav_settings
          }
          ''')
          old_call = 'Section.entries.forEach { item -> TvNavItem(sectionLabel(item), section == item) { section = item } }'
          if old_call in s:
              s = s.replace(old_call, 'Section.entries.forEach { item -> TvNavItem(sectionLabel(item), section == item, iconRes = sectionIcon(item)) { section = item } }')
          old_func = '''@Composable
          private fun TvNavItem(label: String, selected: Boolean, onClick: () -> Unit) {
              var focused by remember { mutableStateOf(false) }
              val scale by animateFloatAsState(if (focused) 1.025f else 1f, label = "nav-focus")
              Row(
                  Modifier.fillMaxWidth().graphicsLayer { scaleX = scale; scaleY = scale }
                      .clip(RoundedCornerShape(12.dp))
                      .background(if (focused) Focus else if (selected) Color(0xFF14242F) else Color.Transparent)
                      .border(1.dp, if (focused) Accent.copy(alpha = .55f) else Color.Transparent, RoundedCornerShape(12.dp))
                      .onFocusChanged { focused = it.isFocused }.clickable(onClick = onClick).focusable()
                      .padding(horizontal = 12.dp, vertical = 10.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  Box(Modifier.size(6.dp).clip(RoundedCornerShape(3.dp)).background(if (selected || focused) Accent else Color.Transparent))
                  Spacer(Modifier.width(9.dp))
                  Text(label, color = if (focused || selected) Color.White else Muted, fontSize = 14.sp, fontWeight = if (selected) FontWeight.SemiBold else FontWeight.Normal, maxLines = 2)
              }
          }
          '''
          new_func = '''@Composable
          private fun TvNavItem(label: String, selected: Boolean, iconRes: Int? = null, onClick: () -> Unit) {
              var focused by remember { mutableStateOf(false) }
              val scale by animateFloatAsState(if (focused) 1.025f else 1f, label = "nav-focus")
              val foreground = if (focused || selected) Color.White else Muted
              val iconColor = if (focused || selected) Accent else Color(0xFF718292)
              Row(
                  Modifier.fillMaxWidth().graphicsLayer { scaleX = scale; scaleY = scale }
                      .clip(RoundedCornerShape(12.dp))
                      .background(if (focused) Focus else if (selected) Color(0xFF14242F) else Color.Transparent)
                      .border(1.dp, if (focused) Accent.copy(alpha = .55f) else Color.Transparent, RoundedCornerShape(12.dp))
                      .onFocusChanged { focused = it.isFocused }.clickable(onClick = onClick).focusable()
                      .padding(horizontal = if (iconRes != null) 9.dp else 12.dp, vertical = 9.dp),
                  verticalAlignment = Alignment.CenterVertically
              ) {
                  if (iconRes != null) {
                      Box(Modifier.width(3.dp).height(26.dp).clip(RoundedCornerShape(2.dp)).background(if (selected || focused) Accent else Color.Transparent))
                      Spacer(Modifier.width(9.dp))
                      Image(painter = painterResource(iconRes), contentDescription = null, modifier = Modifier.size(24.dp), colorFilter = ColorFilter.tint(iconColor))
                      Spacer(Modifier.width(11.dp))
                  } else {
                      Box(Modifier.size(6.dp).clip(RoundedCornerShape(3.dp)).background(if (selected || focused) Accent else Color.Transparent))
                      Spacer(Modifier.width(9.dp))
                  }
                  Text(label, color = foreground, fontSize = 14.sp, fontWeight = if (selected || focused) FontWeight.SemiBold else FontWeight.Normal, maxLines = 2)
              }
          }
          '''
          if 'iconRes: Int? = null' not in s:
              assert old_func in s
              s = s.replace(old_func, new_func)
          p.write_text(s)
          b = Path('app/build.gradle.kts')
          b.write_text(b.read_text().replace('versionCode = 17','versionCode = 18').replace('versionName = "0.3.7-management-favorites-quality"','versionName = "0.3.8-navigation-icons"'))
          PY
          mkdir -p app/src/main/res/drawable docs
          cat > app/src/main/res/drawable/ic_nav_home.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M12,3L2,12h3v9h6v-6h2v6h6v-9h3L12,3z"/></vector>
          XML
          cat > app/src/main/res/drawable/ic_nav_live.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M21,4H3c-1.1,0 -2,0.9 -2,2v11c0,1.1 0.9,2 2,2h6v2h6v-2h6c1.1,0 2,-0.9 2,-2V6c0,-1.1 -0.9,-2 -2,-2zM21,17H3V6h18v11z"/></vector>
          XML
          cat > app/src/main/res/drawable/ic_nav_movies.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M4,3h16c1.1,0 2,0.9 2,2v14c0,1.1 -0.9,2 -2,2H4c-1.1,0 -2,-0.9 -2,-2V5c0,-1.1 0.9,-2 2,-2zM4,5v3h3L5.5,5H4zM8,5l1.5,3H13l-1.5,-3H8zM14,5l1.5,3H19L17.5,5H14zM20,10H4v9h16v-9z"/></vector>
          XML
          cat > app/src/main/res/drawable/ic_nav_series.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M4,5h14c1.1,0 2,0.9 2,2v10c0,1.1 -0.9,2 -2,2H4c-1.1,0 -2,-0.9 -2,-2V7c0,-1.1 0.9,-2 2,-2zM4,7v10h14V7H4zM21,8h1v10c0,2.2 -1.8,4 -4,4H6v-1h12c1.7,0 3,-1.3 3,-3V8zM9,9l5,3 -5,3V9z"/></vector>
          XML
          cat > app/src/main/res/drawable/ic_nav_favorites.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M17,3H7c-1.1,0 -2,0.9 -2,2v16l7,-3 7,3V5c0,-1.1 -0.9,-2 -2,-2zM17,18l-5,-2.18L7,18V5h10v13z"/></vector>
          XML
          cat > app/src/main/res/drawable/ic_nav_recent.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M13,3c-4.97,0 -9,4.03 -9,9H1l4,4 4,-4H6c0,-3.87 3.13,-7 7,-7s7,3.13 7,7 -3.13,7 -7,7c-1.93,0 -3.68,-0.79 -4.95,-2.05l-1.42,1.42C8.27,20.01 10.51,21 13,21c4.97,0 9,-4.03 9,-9s-4.03,-9 -9,-9zM12,8v5l4.25,2.52 0.75,-1.23 -3.5,-2.04V8H12z"/></vector>
          XML
          cat > app/src/main/res/drawable/ic_nav_settings.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#FFFFFFFF" android:pathData="M19.43,12.98c0.04,-0.32 0.07,-0.65 0.07,-0.98s-0.03,-0.66 -0.07,-0.98l2.11,-1.65c0.19,-0.15 0.24,-0.42 0.12,-0.64l-2,-3.46c-0.12,-0.22 -0.37,-0.31 -0.6,-0.22l-2.49,1c-0.52,-0.4 -1.08,-0.73 -1.69,-0.98L14.5,2.42C14.47,2.18 14.25,2 14,2h-4c-0.25,0 -0.46,0.18 -0.49,0.42L9.13,5.07c-0.61,0.25 -1.17,0.58 -1.69,0.98l-2.49,-1c-0.23,-0.09 -0.48,0 -0.6,0.22l-2,3.46c-0.12,0.22 -0.07,0.49 0.12,0.64l2.11,1.65c-0.04,0.32 -0.08,0.66 -0.08,0.98s0.04,0.66 0.08,0.98l-2.11,1.65c-0.19,0.15 -0.24,0.42 -0.12,0.64l2,3.46c0.12,0.22 0.37,0.31 0.6,0.22l2.49,-1c0.52,0.4 1.08,0.73 1.69,0.98l0.38,2.65c0.03,0.24 0.24,0.42 0.49,0.42h4c0.25,0 0.46,-0.18 0.49,-0.42l0.38,-2.65c0.61,-0.25 1.17,-0.58 1.69,-0.98l2.49,1c0.23,0.09 0.48,0 0.6,-0.22l2,-3.46c0.12,-0.22 0.07,-0.49 -0.12,-0.64l-2.11,-1.65zM12,15.5c-1.93,0 -3.5,-1.57 -3.5,-3.5s1.57,-3.5 3.5,-3.5 3.5,1.57 3.5,3.5 -1.57,3.5 -3.5,3.5z"/></vector>
          XML
          cat > docs/RELEASE-0.3.8.md <<'MD'
          # Selyro TV 0.3.8 — Navigation Icons
          - Real vector icons (not emoji) for Home, Live TV, Movies, Series, Favorites, Recent and Settings.
          - Permanent icon + text sidebar; no folding/collapsing in this release.
          - Stronger TV focus with accent marker and icon tint.
          - Category lists remain text-first to avoid clutter.
          - No playback engine, bitrate, decoder, buffer-profile or stream-quality logic changes.
          - Preserves 0.3.7 server management, favorites and connection-quality features.
          - Release: versionCode 18 / versionName 0.3.8-navigation-icons.
          MD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java/com/selyro/tv/ui/SelyroApp.kt app/src/main/res/drawable/ic_nav_*.xml docs/RELEASE-0.3.8.md
          git commit -m 'feat: Selyro TV 0.3.8 navigation icons'
          git push origin HEAD:release/0.3.8-navigation-icons
