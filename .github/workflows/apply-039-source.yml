name: Apply Selyro TV 0.3.9 source

on:
  push:
    branches: ['release/0.3.9-stability-speed']
    paths:
      - '.github/workflows/apply-039-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.9-stability-speed
          fetch-depth: 0
      - name: Apply scoped 0.3.9 patch
        run: python3 .ci/apply-039.py
      - name: Verify scoped source contract
        run: |
          set -euxo pipefail
          grep -q 'versionCode = 19' app/build.gradle.kts
          grep -q 'versionName = "0.3.9-stability-speed"' app/build.gradle.kts
          test "$(grep -c 'probeServers()' app/src/main/java/com/selyro/tv/ui/AppViewModel.kt)" -eq 1
          test "$(grep -c 'vm.probeServers()' app/src/main/java/com/selyro/tv/ui/SelyroApp.kt)" -eq 1
          ! grep -q 'bufferedPercentage' app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt
          grep -q 'totalBufferedDuration' app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt
          grep -q 'scheduleRebufferWatchdog' app/src/main/java/com/selyro/tv/player/PlaybackManager.kt
          grep -q 'FAST(5_000, 15_000, 650, 1_200)' app/src/main/java/com/selyro/tv/player/StreamingProfile.kt
          grep -q 'BALANCED(10_000, 30_000, 1_000, 2_000)' app/src/main/java/com/selyro/tv/player/StreamingProfile.kt
          grep -q 'STABLE(20_000, 50_000, 2_000, 4_000)' app/src/main/java/com/selyro/tv/player/StreamingProfile.kt
      - name: Commit source update
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java/com/selyro/tv/ui/AppViewModel.kt app/src/main/java/com/selyro/tv/ui/SelyroApp.kt app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt app/src/main/java/com/selyro/tv/player/PlaybackManager.kt docs/RELEASE-0.3.9.md
          git commit -m 'Selyro TV 0.3.9 stability and speed' || exit 0
          git push origin HEAD:release/0.3.9-stability-speed
