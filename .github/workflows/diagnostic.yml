name: Selyro Compile Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Capture compile output
        id: compile
        shell: bash
        run: |
          set +e
          gradle :app:compileDebugKotlin --stacktrace 2>&1 | tee /tmp/selyro-compile.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report compile failure to PR
        if: steps.compile.outputs.exit_code != '0' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Selyro compile diagnostic'
            echo '```text'
            tail -n 140 /tmp/selyro-compile.log
            echo '```'
          } > /tmp/selyro-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/selyro-comment.md
      - name: Mark diagnostic failed
        if: steps.compile.outputs.exit_code != '0'
        run: exit 1
