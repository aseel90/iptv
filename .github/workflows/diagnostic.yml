name: Selyro QA Diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Capture compile output
        id: compile
        shell: bash
        run: |
          set +e
          gradle :app:compileDebugKotlin --stacktrace --console=plain 2>&1 | tee /tmp/selyro-compile.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Capture lint output
        id: lint
        if: steps.compile.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          gradle :app:lintDebug --stacktrace --console=plain 2>&1 | tee /tmp/selyro-lint.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build diagnostic report
        if: steps.compile.outputs.exit_code != '0' || steps.lint.outputs.exit_code != '0'
        shell: bash
        run: |
          {
            echo '### Selyro QA diagnostic — root cause'
            echo '```text'
            if [ "${{ steps.compile.outputs.exit_code }}" != "0" ]; then
              echo '--- COMPILE ---'
              grep -n -E '(^e: |error:|FAILURE:|What went wrong|Could not|Unresolved reference|Compilation error|Caused by:|Exception|requires|Minimum supported|not found)' /tmp/selyro-compile.log | head -n 180 || true
            fi
            if [ "${{ steps.lint.outputs.exit_code }}" != "0" ] && [ -f /tmp/selyro-lint.log ]; then
              echo '--- LINT ---'
              grep -n -E '(Error:|Warning:|FAILURE:|What went wrong|Caused by:|Lint found|\[.*\])' /tmp/selyro-lint.log | head -n 220 || true
              echo '--- lint text report ---'
              find app/build/reports -type f \( -name 'lint-results-debug.txt' -o -name 'lint-results*.txt' \) -print -exec sed -n '1,220p' {} \; 2>/dev/null || true
            fi
            echo '```'
          } > /tmp/selyro-comment.md
      - name: Report failure to PR
        if: (steps.compile.outputs.exit_code != '0' || steps.lint.outputs.exit_code != '0') && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/selyro-comment.md
      - name: Mark diagnostic failed
        if: steps.compile.outputs.exit_code != '0' || steps.lint.outputs.exit_code != '0'
        run: exit 1
