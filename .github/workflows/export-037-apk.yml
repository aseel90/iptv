name: Export Selyro TV 0.3.7 APK

on:
  push:
    branches: ['release/0.3.7-management-favorites-quality']
    paths-ignore:
      - 'ci-artifacts/**'
      - 'relay/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.3.7-management-favorites-quality
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Verify 0.3.7 source contract
        run: |
          set -euxo pipefail
          grep -q 'versionCode = 17' app/build.gradle.kts
          grep -q 'versionName = "0.3.7-management-favorites-quality"' app/build.gradle.kts
          grep -q 'fun updateAccount' app/src/main/java/com/selyro/tv/ui/AppViewModel.kt
          grep -q 'ConnectionGrade' app/src/main/java/com/selyro/tv/ui/AppViewModel.kt
          grep -q 'ServerQualityBadge' app/src/main/java/com/selyro/tv/ui/SelyroApp.kt
          grep -q 'trailingLabel' app/src/main/java/com/selyro/tv/ui/SelyroApp.kt
          grep -q 'StreamQualityBadge' app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt
          grep -q 'fun replace' app/src/main/java/com/selyro/tv/data/AccountStore.kt
      - name: Verify lifecycle, Live UX and TV identity remain preserved
        run: |
          set -euxo pipefail
          grep -q 'android.permission.HIDE_OVERLAY_WINDOWS' app/src/main/AndroidManifest.xml
          grep -q 'android:launchMode="singleTask"' app/src/main/AndroidManifest.xml
          grep -q 'setHideOverlayWindows(true)' app/src/main/java/com/selyro/tv/MainActivity.kt
          grep -q 'Lifecycle.Event.ON_STOP' app/src/main/java/com/selyro/tv/ui/SelyroApp.kt
          grep -q 'fun queueZap' app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt
          grep -q 'LiveControlHub' app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt
          grep -q 'LiveChannelDrawer' app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt
          test -s app/src/main/res/drawable-xhdpi/selyro_tv_banner_asset.png
          file app/src/main/res/drawable-xhdpi/selyro_tv_banner_asset.png | grep -q '320 x 180'
          test -s app/src/main/res/mipmap-xhdpi/ic_launcher_tv.png
          file app/src/main/res/mipmap-xhdpi/ic_launcher_tv.png | grep -q '160 x 160'
      - name: Test lint and build
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Re-sign with stable Selyro QA key
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.pk8 -o /tmp/selyro-testkey.pk8
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.x509.pem -o /tmp/selyro-testkey.x509.pem
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign --key /tmp/selyro-testkey.pk8 --cert /tmp/selyro-testkey.x509.pem --out /tmp/Selyro-TV-signed.apk "$APK"
          mv /tmp/Selyro-TV-signed.apk "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK"
      - name: Verify APK identity and version
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.selyro.tv' versionCode='17'" /tmp/apk-badging.txt
          grep -q "application-label:'Selyro TV'" /tmp/apk-badging.txt
          grep -q "leanback-launchable-activity: name='com.selyro.tv.MainActivity'" /tmp/apk-badging.txt
      - name: Export updater APK and relay chunks
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ci-artifacts relay/selyro
          rm -f relay/selyro/apk.b64.part-*
          cp "$APK" ci-artifacts/Selyro-TV-v0.3.7-management-favorites-quality.apk
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          sha256sum ci-artifacts/Selyro-TV-v0.3.7-management-favorites-quality.apk > ci-artifacts/Selyro-TV-v0.3.7-management-favorites-quality.sha256
          base64 -w0 "$APK" | split -b 700k - relay/selyro/apk.b64.part-
          cat > relay/selyro/manifest.env <<EOF
          VERSION_CODE=17
          VERSION_NAME=0.3.7-management-favorites-quality
          SHA256=$SHA
          NOTES=Server management with edit/delete confirmations and clean active-server state, direct Live channel favorites with star controls, and connection-quality indicators for saved servers and active playback based on latency, startup, buffering and playback errors.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-artifacts/Selyro-TV-v0.3.7-management-favorites-quality.apk ci-artifacts/Selyro-TV-v0.3.7-management-favorites-quality.sha256 relay/selyro
          git commit -m 'Export stable-signed Selyro TV v0.3.7 management favorites quality' || exit 0
          git push origin HEAD:release/0.3.7-management-favorites-quality
      - uses: actions/upload-artifact@v4
        with:
          name: Selyro-TV-v0.3.7-management-favorites-quality
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
