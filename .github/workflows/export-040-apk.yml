name: Export Selyro TV 0.4.0 APK

on:
  push:
    branches: ['release/0.4.0-account-foundation']
    paths-ignore:
      - 'ci-artifacts/**'
      - 'relay/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.4.0-account-foundation
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Apply 0.4.0 account foundation source
        shell: bash
        env:
          ACCOUNT_STORE_GZ_B64: ''
          ACCOUNT_TEST_GZ_B64: ''
        run: |
          set -euxo pipefail
          printf '%s' "$ACCOUNT_STORE_GZ_B64" | base64 -d | gzip -d > app/src/main/java/com/selyro/tv/data/AccountStore.kt
          mkdir -p app/src/test/java/com/selyro/tv/model
          printf '%s' "$ACCOUNT_TEST_GZ_B64" | base64 -d | gzip -d > app/src/test/java/com/selyro/tv/model/AccountIdentityTest.kt
          python - <<'PY'
          from pathlib import Path

          models = Path('app/src/main/java/com/selyro/tv/model/Models.kt')
          text = models.read_text()
          if 'import java.util.UUID' not in text:
              text = text.replace('package com.selyro.tv.model\n\n', 'package com.selyro.tv.model\n\nimport java.util.UUID\n\n')
          if 'val id: String = UUID.randomUUID().toString()' not in text:
              text = text.replace(
                  '    val type: SourceType = SourceType.XTREAM\n)',
                  '    val type: SourceType = SourceType.XTREAM,\n    val id: String = UUID.randomUUID().toString()\n)'
              )
          models.write_text(text)

          vm = Path('app/src/main/java/com/selyro/tv/ui/AppViewModel.kt')
          text = vm.read_text()
          text = text.replace(
              '    private fun accountKey(account: PlaylistAccount): String =\n        "${account.type}:${account.server.trim()}:${account.username}"\n\n    fun qualityFor',
              '    private fun accountKey(account: PlaylistAccount): String = account.id\n\n    private fun refreshScopedState() {\n        favorites.value = store.favorites()\n        recents.value = store.recents()\n        playbackProgress.value = store.playbackProgress()\n    }\n\n    fun qualityFor'
          )
          text = text.replace(
              '                store.save(account)\n                accounts.value = store.accounts()\n                _account.value = account\n',
              '                val savedAccount = store.save(account)\n                accounts.value = store.accounts()\n                _account.value = savedAccount\n                refreshScopedState()\n'
          )
          text = text.replace(
              '                store.replace(original, updated)\n                accounts.value = store.accounts()\n                if (wasActive) {\n                    _account.value = updated\n',
              '                val savedAccount = store.replace(original, updated)\n                accounts.value = store.accounts()\n                if (wasActive) {\n                    _account.value = savedAccount\n                    refreshScopedState()\n'
          )
          text = text.replace(
              '        _account.value = store.load()\n        if (_account.value != null && channels.value.isEmpty()) loadLive(force = true)\n',
              '        _account.value = store.load()\n        refreshScopedState()\n        if (_account.value != null && channels.value.isEmpty()) loadLive(force = true)\n'
          )
          text = text.replace(
              '        _account.value = target\n        channels.value = emptyList()\n',
              '        _account.value = target\n        refreshScopedState()\n        channels.value = emptyList()\n'
          )
          text = text.replace(
              '            _account.value = store.load()\n            channels.value = emptyList()\n',
              '            _account.value = store.load()\n            refreshScopedState()\n            channels.value = emptyList()\n'
          )
          vm.write_text(text)

          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text().replace('versionCode = 19', 'versionCode = 20').replace('versionName = "0.3.9-stability-speed"', 'versionName = "0.4.0-account-foundation"')
          gradle.write_text(text)
          PY
      - name: Verify account-foundation contract
        run: |
          set -euxo pipefail
          grep -q 'versionCode = 20' app/build.gradle.kts
          grep -q 'versionName = "0.4.0-account-foundation"' app/build.gradle.kts
          grep -q 'val id: String = UUID.randomUUID().toString()' app/src/main/java/com/selyro/tv/model/Models.kt
          grep -q 'accounts_v3' app/src/main/java/com/selyro/tv/data/AccountStore.kt
          grep -q 'active_account_id' app/src/main/java/com/selyro/tv/data/AccountStore.kt
          grep -q 'favorites_v2.' app/src/main/java/com/selyro/tv/data/AccountStore.kt
          grep -q 'recent_v2.' app/src/main/java/com/selyro/tv/data/AccountStore.kt
          grep -q 'playback_progress_v2.' app/src/main/java/com/selyro/tv/data/AccountStore.kt
          grep -q 'migrateLegacyScopedState' app/src/main/java/com/selyro/tv/data/AccountStore.kt
          grep -q 'clearScopedState(removed.id)' app/src/main/java/com/selyro/tv/data/AccountStore.kt
          grep -q 'refreshScopedState' app/src/main/java/com/selyro/tv/ui/AppViewModel.kt
          git diff --exit-code origin/release/0.3.9-stability-speed -- app/src/main/java/com/selyro/tv/player app/src/main/java/com/selyro/tv/iptv app/src/main/java/com/selyro/tv/update app/src/main/AndroidManifest.xml
      - name: Test lint and build
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Re-sign with stable Selyro QA key
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.pk8 -o /tmp/selyro-testkey.pk8
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.x509.pem -o /tmp/selyro-testkey.x509.pem
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign --key /tmp/selyro-testkey.pk8 --cert /tmp/selyro-testkey.x509.pem --out /tmp/Selyro-TV-signed.apk "$APK"
          mv /tmp/Selyro-TV-signed.apk "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK"
      - name: Verify APK identity and version
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.selyro.tv' versionCode='20'" /tmp/apk-badging.txt
          grep -q "application-label:'Selyro TV'" /tmp/apk-badging.txt
          grep -q "leanback-launchable-activity: name='com.selyro.tv.MainActivity'" /tmp/apk-badging.txt
      - name: Commit source and export updater APK
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ci-artifacts relay/selyro
          rm -f relay/selyro/apk.b64.part-*
          cp "$APK" ci-artifacts/Selyro-TV-v0.4.0-account-foundation.apk
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          sha256sum ci-artifacts/Selyro-TV-v0.4.0-account-foundation.apk > ci-artifacts/Selyro-TV-v0.4.0-account-foundation.sha256
          base64 -w0 "$APK" | split -b 700k - relay/selyro/apk.b64.part-
          cat > relay/selyro/manifest.env <<EOF2
          VERSION_CODE=20
          VERSION_NAME=0.4.0-account-foundation
          SHA256=$SHA
          NOTES=Account foundation update: each IPTV provider now has a stable account identity. Favorites, recent history and resume progress are isolated per server, existing 0.3.9 data is migrated safely to the active provider, and deleting a server removes only that server's local state. Playback and stream handling are unchanged.
          EOF2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java/com/selyro/tv/model/Models.kt app/src/main/java/com/selyro/tv/data/AccountStore.kt app/src/main/java/com/selyro/tv/ui/AppViewModel.kt app/src/test/java/com/selyro/tv/model/AccountIdentityTest.kt ci-artifacts/Selyro-TV-v0.4.0-account-foundation.apk ci-artifacts/Selyro-TV-v0.4.0-account-foundation.sha256 relay/selyro
          git commit -m 'Release Selyro TV v0.4.0 account foundation' || exit 0
          git push origin HEAD:release/0.4.0-account-foundation
      - uses: actions/upload-artifact@v4
        with:
          name: Selyro-TV-v0.4.0-account-foundation
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
