name: Materialize Selyro 0.3.4 Live TV UX

on:
  push:
    branches: ["release/0.3.4-live-tv-ux-v2"]
    paths:
      - ".selyro-034/**"
      - ".github/workflows/materialize-034-live-ux.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore sources
        run: |
          python - <<'PY2'
          import base64, gzip, glob
          from pathlib import Path
          specs = {
            'player': 'app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt',
            'selyro': 'app/src/main/java/com/selyro/tv/ui/SelyroApp.kt',
            'build': 'app/build.gradle.kts',
          }
          for stem, out in specs.items():
            payload = ''.join(Path(p).read_text() for p in sorted(glob.glob(f'.selyro-034/{stem}.*')))
            data = gzip.decompress(base64.b64decode(payload))
            p = Path(out)
            p.parent.mkdir(parents=True, exist_ok=True)
            p.write_bytes(data)
          PY2
      - name: Commit sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt app/src/main/java/com/selyro/tv/ui/SelyroApp.kt app/build.gradle.kts
          git diff --cached --quiet && exit 0
          git commit -m "feat(live): implement 0.3.4 Live TV UX"
          git push
