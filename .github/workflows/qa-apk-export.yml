name: Export QA APK

on:
  push:
    branches:
      - 'qa/full-v1-ci'
    paths-ignore:
      - 'ci-artifacts/**'
      - 'update/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-v1-ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Test and build
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify APK identity and launchability
        run: |
          set -euxo pipefail
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-badging.txt
          grep -q "package: name='com.selyro.tv'" /tmp/apk-badging.txt
          grep -q "application-label:'Selyro TV'" /tmp/apk-badging.txt
          grep -q "launchable-activity: name='com.selyro.tv.MainActivity'" /tmp/apk-badging.txt
          grep -q "leanback-launchable-activity: name='com.selyro.tv.MainActivity'" /tmp/apk-badging.txt
      - name: Publish stable update channel
        run: |
          set -euxo pipefail
          mkdir -p ci-artifacts update
          APK=app/build/outputs/apk/debug/app-debug.apk
          cp "$APK" ci-artifacts/Selyro-TV-v0.2.5-updater.apk
          cp "$APK" update/Selyro-TV-latest.apk
          SHA=$(sha256sum update/Selyro-TV-latest.apk | awk '{print $1}')
          printf '%s  %s\n' "$SHA" 'Selyro-TV-latest.apk' > update/Selyro-TV-latest.sha256
          cat > update/latest.json <<EOF
          {
            "versionCode": 6,
            "versionName": "0.2.5-updater",
            "apkUrl": "https://raw.githubusercontent.com/aseel90/iptv/qa/full-v1-ci/update/Selyro-TV-latest.apk",
            "sha256": "$SHA",
            "notes": "Built-in one-click update downloads are now enabled."
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-artifacts/Selyro-TV-v0.2.5-updater.apk update/Selyro-TV-latest.apk update/Selyro-TV-latest.sha256 update/latest.json
          git commit -m 'Publish Selyro TV v0.2.5 updater APK' || exit 0
          git push origin HEAD:qa/full-v1-ci
