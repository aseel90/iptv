name: Export QA APK

on:
  push:
    branches: ['qa/full-v1-ci']
    paths-ignore:
      - 'ci-artifacts/**'
      - 'relay/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/full-v1-ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Test and build
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Re-sign with stable Selyro QA test key
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.pk8 -o /tmp/selyro-testkey.pk8
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.x509.pem -o /tmp/selyro-testkey.x509.pem
          $ANDROID_HOME/build-tools/36.0.0/apksigner sign \
            --key /tmp/selyro-testkey.pk8 \
            --cert /tmp/selyro-testkey.x509.pem \
            --out /tmp/Selyro-TV-signed.apk \
            "$APK"
          mv /tmp/Selyro-TV-signed.apk "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK" | tee /tmp/apk-signer.txt
          grep -q 'Signer #1 certificate SHA-256 digest:' /tmp/apk-signer.txt
      - name: Verify APK identity and launchability
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.selyro.tv'" /tmp/apk-badging.txt
          grep -q "application-label:'Selyro TV'" /tmp/apk-badging.txt
          grep -q "launchable-activity: name='com.selyro.tv.MainActivity'" /tmp/apk-badging.txt
          grep -q "leanback-launchable-activity: name='com.selyro.tv.MainActivity'" /tmp/apk-badging.txt
      - name: Export updater base and relay chunks
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ci-artifacts relay/selyro
          rm -f relay/selyro/apk.b64.part-*
          cp "$APK" ci-artifacts/Selyro-TV-v0.2.7-tv-polish.apk
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          sha256sum ci-artifacts/Selyro-TV-v0.2.7-tv-polish.apk > ci-artifacts/Selyro-TV-v0.2.7-tv-polish.sha256
          base64 -w0 "$APK" | split -b 700k - relay/selyro/apk.b64.part-
          cat > relay/selyro/manifest.env <<EOF
          VERSION_CODE=8
          VERSION_NAME=0.2.7-tv-polish
          SHA256=$SHA
          NOTES=Arabic RTL, multi-server profiles, grid mode, buffering indicator, exit confirmation, and TV UI polish.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-artifacts/Selyro-TV-v0.2.7-tv-polish.apk ci-artifacts/Selyro-TV-v0.2.7-tv-polish.sha256 relay/selyro
          git commit -m 'Export stable-signed Selyro TV v0.2.7 TV polish' || exit 0
          git push origin HEAD:qa/full-v1-ci
