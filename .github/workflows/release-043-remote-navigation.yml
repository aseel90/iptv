name: Release Selyro TV 0.4.3 Remote Navigation Hotfix

on:
  push:
    branches: ['release/0.4.3-remote-navigation-hotfix']
    paths:
      - '.github/workflows/release-043-remote-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.4.3-remote-navigation-hotfix
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.13
        run: |
          set -euxo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Apply 0.4.3 hotfix
        run: |
          set -euxo pipefail
          python .ci/apply_043.py

      - name: Verify remote navigation contract
        run: |
          set -euxo pipefail
          grep -q 'versionCode = 23' app/build.gradle.kts
          grep -q 'versionName = "0.4.3-remote-navigation-hotfix"' app/build.gradle.kts
          grep -q 'channelDrawerAlignment = if (language == AppLanguage.ARABIC) Alignment.CenterEnd else Alignment.CenterStart' app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt
          grep -q 'liveInfoAlignment = if (language == AppLanguage.ARABIC) Alignment.CenterStart else Alignment.CenterEnd' app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt
          grep -q 'LiveChannelDrawer(Modifier.align(channelDrawerAlignment)' app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt
          grep -q 'Modifier.align(liveInfoAlignment), language, currentLiveChannel' app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt
          test "$(grep -c 'CompositionLocalProvider(LocalLayoutDirection provides LayoutDirection.Ltr)' app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt)" -ge 4
          grep -q 'Key.DirectionLeft -> { liveHubCursor = (liveHubCursor - 1 + 5) % 5; true }' app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt
          grep -q 'Key.DirectionRight -> { liveHubCursor = (liveHubCursor + 1) % 5; true }' app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt
          git diff --exit-code origin/release/0.4.2-server-recent-hotfix -- app/src/main/java/com/selyro/tv/player/StreamingProfile.kt app/src/main/java/com/selyro/tv/player/PlayerFactory.kt app/src/main/java/com/selyro/tv/player/PlaybackManager.kt app/src/main/java/com/selyro/tv/update app/src/main/AndroidManifest.xml

      - name: Test lint and build
        run: |
          set +e
          set -o pipefail
          mkdir -p ci-status
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace 2>&1 | tee ci-status/043-gradle.log
          code=${PIPESTATUS[0]}
          echo "$code" > ci-status/043-exit.txt
          exit "$code"

      - name: Commit failure diagnostics
        if: failure()
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-status || true
          git diff --cached --quiet && exit 0
          git commit -m '[skip ci] ci: capture 0.4.3 build failure'
          git push origin HEAD:release/0.4.3-remote-navigation-hotfix

      - name: Sign and verify APK
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.pk8 -o /tmp/selyro-testkey.pk8
          curl -fsSL https://raw.githubusercontent.com/aosp-mirror/platform_build/main/target/product/security/testkey.x509.pem -o /tmp/selyro-testkey.x509.pem
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --key /tmp/selyro-testkey.pk8 --cert /tmp/selyro-testkey.x509.pem --out /tmp/Selyro-TV-signed.apk "$APK"
          mv /tmp/Selyro-TV-signed.apk "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -q "package: name='com.selyro.tv' versionCode='23'" /tmp/apk-badging.txt
          grep -q "application-label:'Selyro TV'" /tmp/apk-badging.txt
          grep -q "leanback-launchable-activity: name='com.selyro.tv.MainActivity'" /tmp/apk-badging.txt

      - name: Export verified update
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          mkdir -p ci-artifacts
          cp "$APK" ci-artifacts/Selyro-TV-v0.4.3-remote-navigation-hotfix.apk
          sha256sum ci-artifacts/Selyro-TV-v0.4.3-remote-navigation-hotfix.apk > ci-artifacts/Selyro-TV-v0.4.3-remote-navigation-hotfix.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts app/src/main/java/com/selyro/tv/ui/PlayerScreen.kt ci-artifacts/Selyro-TV-v0.4.3-remote-navigation-hotfix.apk ci-artifacts/Selyro-TV-v0.4.3-remote-navigation-hotfix.sha256
          git commit -m '[skip ci] Release Selyro TV v0.4.3 remote navigation hotfix'
          git push origin HEAD:release/0.4.3-remote-navigation-hotfix

      - uses: actions/upload-artifact@v4
        with:
          name: Selyro-TV-v0.4.3-remote-navigation-hotfix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
