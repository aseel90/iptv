name: Android TV Smoke Test

on:
  push:
    branches:
      - 'qa/full-v1-ci'
    paths-ignore:
      - 'ci-artifacts/**'
  workflow_dispatch:

jobs:
  tv-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android TV and launch Selyro
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: android-tv
          arch: x86_64
          cores: 2
          ram-size: 1536M
          heap-size: 256
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            gradle :app:assembleDebug --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.selyro.tv/.MainActivity | tee /tmp/start.txt
            grep -q 'Status: ok' /tmp/start.txt
            sleep 6
            adb shell pidof com.selyro.tv | grep -Eq '[0-9]+'
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.selyro.tv/.MainActivity'
            if adb logcat -d -v brief '*:E' | grep -E 'FATAL EXCEPTION|Process: com.selyro.tv' ; then
              echo 'Selyro crashed during TV smoke test'
              exit 1
            fi
