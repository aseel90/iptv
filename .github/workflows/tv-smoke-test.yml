name: Selyro Direct Android Runtime Smoke

on:
  push:
    branches:
      - 'qa/full-v1-ci'
    paths-ignore:
      - 'ci-artifacts/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  runtime-smoke:
    name: direct-runtime-api-${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            arch: x86
            image: system-images;android-28;google_apis;x86
            ram: 1024
            device_label: Android 9 / Mi TV Stick generation
          - api: 30
            arch: x86_64
            image: system-images;android-30;google_apis;x86_64
            ram: 1536
            device_label: Android 11 / Xiaomi TV Stick 4K generation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install emulator and API image
        id: setupemu
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-36" "build-tools;36.0.0" "${{ matrix.image }}" 2>&1 | tee sdk-install-api-${{ matrix.api }}.log
          sdkmanager --list_installed > sdk-installed-api-${{ matrix.api }}.txt
          echo no | avdmanager create avd --force --name selyro-api-${{ matrix.api }} --package "${{ matrix.image }}" --device "tv_1080p" 2>&1 | tee avd-create-api-${{ matrix.api }}.log || \
            echo no | avdmanager create avd --force --name selyro-api-${{ matrix.api }} --package "${{ matrix.image }}" 2>&1 | tee -a avd-create-api-${{ matrix.api }}.log
      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          ls -l /dev/kvm || true
      - name: Boot emulator
        id: boot
        shell: bash
        run: |
          set -euxo pipefail
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd selyro-api-${{ matrix.api }} \
            -no-window -no-snapshot -noaudio -no-boot-anim \
            -gpu swiftshader_indirect -memory ${{ matrix.ram }} \
            > emulator-api-${{ matrix.api }}.log 2>&1 &
          echo $! > emulator-api-${{ matrix.api }}.pid

          adb start-server
          ready=0
          for i in $(seq 1 120); do
            state=$(adb get-state 2>/dev/null || true)
            booted=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$state" = "device" ] && [ "$booted" = "1" ]; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != "1" ]; then
            echo 'Emulator did not boot'
            tail -n 180 emulator-api-${{ matrix.api }}.log || true
            exit 1
          fi
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk
      - name: Build install and launch Selyro
        id: appsmoke
        shell: bash
        run: |
          set -euxo pipefail
          gradle :app:assembleDebug --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          adb install -r "$APK"

          adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.selyro.tv | tee launcher-api-${{ matrix.api }}.txt
          grep -q 'com.selyro.tv/.MainActivity' launcher-api-${{ matrix.api }}.txt
          adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LEANBACK_LAUNCHER com.selyro.tv | tee leanback-api-${{ matrix.api }}.txt
          grep -q 'com.selyro.tv/.MainActivity' leanback-api-${{ matrix.api }}.txt

          adb logcat -c
          adb shell am force-stop com.selyro.tv
          adb shell am start -W -n com.selyro.tv/.MainActivity | tee start-api-${{ matrix.api }}.txt
          sleep 10
          adb logcat -d -v threadtime > app-logcat-api-${{ matrix.api }}.txt
          adb shell dumpsys activity activities > activities-api-${{ matrix.api }}.txt

          adb shell pidof com.selyro.tv | grep -Eq '[0-9]+'
          grep -q 'SelyroStartup.*compose:first-composition:ok' app-logcat-api-${{ matrix.api }}.txt
          grep -q 'com.selyro.tv/.MainActivity' activities-api-${{ matrix.api }}.txt

          if grep -A 50 -B 10 -E 'FATAL EXCEPTION|Process: com.selyro.tv|AndroidRuntime' app-logcat-api-${{ matrix.api }}.txt; then
            echo 'Fatal Selyro crash detected'
            exit 1
          fi

          # Verify a second cold launch as well.
          adb shell am force-stop com.selyro.tv
          adb logcat -c
          adb shell am start -W -n com.selyro.tv/.MainActivity | tee start2-api-${{ matrix.api }}.txt
          sleep 5
          adb logcat -d -v threadtime > app-logcat2-api-${{ matrix.api }}.txt
          adb shell pidof com.selyro.tv | grep -Eq '[0-9]+'
          grep -q 'SelyroStartup.*compose:first-composition:ok' app-logcat2-api-${{ matrix.api }}.txt
          if grep -A 50 -B 10 -E 'FATAL EXCEPTION|Process: com.selyro.tv|AndroidRuntime' app-logcat2-api-${{ matrix.api }}.txt; then
            exit 1
          fi
      - name: Report result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SETUP_OUTCOME: ${{ steps.setupemu.outcome }}
          BOOT_OUTCOME: ${{ steps.boot.outcome }}
          APP_OUTCOME: ${{ steps.appsmoke.outcome }}
          API_LEVEL: ${{ matrix.api }}
          DEVICE_LABEL: ${{ matrix.device_label }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head qa/full-v1-ci --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then exit 0; fi
          if [ "$APP_OUTCOME" = "success" ]; then
            printf '%s\n%s\n%s\n%s\n' \
              "### Selyro direct runtime API ${API_LEVEL}: PASS" \
              "Commit: ${GITHUB_SHA}" \
              "Profile: ${DEVICE_LABEL}" \
              'Verified install, launcher resolution, two cold starts, first Compose composition, foreground survival, and no fatal crash.' > /tmp/result.md
          else
            {
              echo "### Selyro direct runtime API ${API_LEVEL}: FAIL"
              echo "Commit: ${GITHUB_SHA}"
              echo "Profile: ${DEVICE_LABEL}"
              echo "Setup=${SETUP_OUTCOME} Boot=${BOOT_OUTCOME} App=${APP_OUTCOME}"
              echo
              if [ -s "app-logcat-api-${API_LEVEL}.txt" ]; then
                echo 'App startup log:'
                echo '```text'
                grep -A 60 -B 12 -E 'SelyroStartup|FATAL EXCEPTION|Process: com.selyro.tv|AndroidRuntime|InflateException|Resources\$NotFoundException|NoSuchMethodError|ClassNotFoundException|IllegalStateException|OutOfMemoryError|VerifyError' "app-logcat-api-${API_LEVEL}.txt" | head -n 260 || tail -n 180 "app-logcat-api-${API_LEVEL}.txt"
                echo '```'
              elif [ -s "emulator-api-${API_LEVEL}.log" ]; then
                echo 'Emulator setup/boot tail:'
                echo '```text'
                tail -n 120 "emulator-api-${API_LEVEL}.log"
                echo '```'
              else
                echo 'Failure happened before app Logcat was available.'
              fi
            } > /tmp/result.md
          fi
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file /tmp/result.md
      - name: Upload all diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selyro-direct-runtime-api-${{ matrix.api }}
          path: |
            sdk-install-api-${{ matrix.api }}.log
            sdk-installed-api-${{ matrix.api }}.txt
            avd-create-api-${{ matrix.api }}.log
            emulator-api-${{ matrix.api }}.log
            launcher-api-${{ matrix.api }}.txt
            leanback-api-${{ matrix.api }}.txt
            start-api-${{ matrix.api }}.txt
            start2-api-${{ matrix.api }}.txt
            app-logcat-api-${{ matrix.api }}.txt
            app-logcat2-api-${{ matrix.api }}.txt
            activities-api-${{ matrix.api }}.txt
          if-no-files-found: ignore
