name: Android TV Smoke Test

on:
  push:
    branches:
      - 'qa/full-v1-ci'
    paths-ignore:
      - 'ci-artifacts/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  tv-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android TV 36 and verify launcher startup
        id: tvrun
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          cores: 2
          ram-size: 1536M
          heap-size: 256
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euxo pipefail
            capture() {
              adb logcat -d -v threadtime > tv-smoke-logcat.txt 2>&1 || true
              adb shell dumpsys activity activities > tv-smoke-activities.txt 2>&1 || true
              adb shell dumpsys package com.selyro.tv > tv-smoke-package.txt 2>&1 || true
            }
            trap capture EXIT

            gradle :app:assembleDebug --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.selyro.tv | tee /tmp/launcher.txt
            grep -q 'com.selyro.tv/.MainActivity' /tmp/launcher.txt
            adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LEANBACK_LAUNCHER com.selyro.tv | tee /tmp/leanback.txt
            grep -q 'com.selyro.tv/.MainActivity' /tmp/leanback.txt

            adb logcat -c
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LEANBACK_LAUNCHER -p com.selyro.tv | tee /tmp/start.txt
            grep -q 'Status: ok' /tmp/start.txt
            sleep 10

            adb shell pidof com.selyro.tv | grep -Eq '[0-9]+'
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|ResumedActivity' | grep -q 'com.selyro.tv/.MainActivity'
            adb logcat -d -v brief | grep -q 'SelyroStartup.*compose:first-composition:ok'

            if adb logcat -d -v brief | grep -A 30 -B 5 -E 'FATAL EXCEPTION|Process: com.selyro.tv' ; then
              echo 'Selyro crashed during TV smoke test'
              exit 1
            fi
      - name: Report TV smoke result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.tvrun.outcome }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head qa/full-v1-ci --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then exit 0; fi
          if [ "$OUTCOME" = "success" ]; then
            printf '%s\n%s\n%s\n' \
              '### Android TV startup smoke: PASS' \
              "Commit: ${GITHUB_SHA}" \
              'Verified both launcher intents, first Compose composition, 10-second resumed MainActivity survival, and no fatal app crash.' > /tmp/tv-result.md
          else
            {
              echo '### Android TV startup smoke: FAIL'
              echo "Commit: ${GITHUB_SHA}"
              echo
              echo 'Relevant startup/crash log:'
              echo '```text'
              if [ -f tv-smoke-logcat.txt ]; then
                grep -A 45 -B 8 -E 'SelyroStartup|FATAL EXCEPTION|AndroidRuntime|Process: com.selyro.tv|InflateException|Resources\$NotFoundException|NoSuchMethodError|ClassNotFoundException|IllegalStateException|OutOfMemoryError' tv-smoke-logcat.txt | head -n 180 || tail -n 120 tv-smoke-logcat.txt
              else
                echo 'No logcat file was captured; emulator/setup may have failed before app launch.'
              fi
              echo '```'
            } > /tmp/tv-result.md
          fi
          gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body-file /tmp/tv-result.md
      - name: Upload TV smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selyro-tv-smoke-diagnostics
          path: |
            tv-smoke-logcat.txt
            tv-smoke-activities.txt
            tv-smoke-package.txt
          if-no-files-found: ignore
