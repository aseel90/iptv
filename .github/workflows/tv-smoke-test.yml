name: Android TV Smoke Test

on:
  push:
    branches:
      - 'qa/full-v1-ci'
    paths-ignore:
      - 'ci-artifacts/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  tv-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.13
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Android TV 36 and verify launcher startup
        id: tvrun
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          cores: 2
          ram-size: 1536M
          heap-size: 256
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -euxo pipefail
            gradle :app:assembleDebug --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            echo 'Verify standard Android launcher intent'
            adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.selyro.tv | tee /tmp/launcher.txt
            grep -q 'com.selyro.tv/.MainActivity' /tmp/launcher.txt

            echo 'Verify Android TV leanback launcher intent'
            adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LEANBACK_LAUNCHER com.selyro.tv | tee /tmp/leanback.txt
            grep -q 'com.selyro.tv/.MainActivity' /tmp/leanback.txt

            adb logcat -c
            echo 'Launch exactly as Android TV launcher does'
            adb shell am start -W -a android.intent.action.MAIN -c android.intent.category.LEANBACK_LAUNCHER -p com.selyro.tv | tee /tmp/start.txt
            grep -q 'Status: ok' /tmp/start.txt
            sleep 6

            adb shell pidof com.selyro.tv | grep -Eq '[0-9]+'
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.selyro.tv/.MainActivity'

            if adb logcat -d -v brief '*:E' | grep -E 'FATAL EXCEPTION|Process: com.selyro.tv' ; then
              echo 'Selyro crashed during TV smoke test'
              exit 1
            fi
      - name: Report TV smoke result to PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.tvrun.outcome }}
        run: |
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head qa/full-v1-ci --state open --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then exit 0; fi
          if [ "$OUTCOME" = "success" ]; then
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "### Android TV launcher smoke: PASS
Commit: \`${GITHUB_SHA}\`
Verified install, standard LAUNCHER resolution, LEANBACK_LAUNCHER resolution, startup to resumed MainActivity, and no fatal app crash."
          else
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "### Android TV launcher smoke: FAIL
Commit: \`${GITHUB_SHA}\`
The TV emulator launchability test failed. Do not distribute this build."
          fi
